[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "she-device"
version = "0.1.0"
description = "Safe RDK X5 runtime and deterministic simulator for SHE"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23,<5",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
she-device = "she_device.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
