name: she
services:
  gateway:
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
    restart: unless-stopped
    init: true
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:${SHE_WEB_PORT:-8080}:8080"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
