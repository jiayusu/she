<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SHE · 指向实验室</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">SHE / 交互实验室</p>
      <h1>指向一个物件，让它进入故事</h1>
    </div>
    <div class="badges">
      <span id="ws-dot" class="dot off" title="小智联动（/ws/crown）">小智未连接</span>
      <span id="cam-dot" class="dot ok" title="隐私：窗口外摄像头流必须停止">摄像头已关闭</span>
    </div>
  </header>

  <main>
    <section class="stage-wrap">
      <div id="stage" class="stage">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="scene-canvas" width="640" height="480" hidden></canvas>
        <canvas id="freeze" hidden></canvas>
        <canvas id="overlay"></canvas>
        <div id="confirm-card" class="confirm-card" hidden>
          <div class="confirm-q">王冠在问 <span id="confirm-round"></span></div>
          <div id="confirm-transcript" class="confirm-t"></div>
          <div id="confirm-buttons" class="confirm-b"></div>
        </div>
      </div>
      <div class="status-bar">
        <span id="status-text">点“指它”，再把小手指向你想问的东西</span>
        <span id="timing"></span>
      </div>
      <div id="bubble" class="bubble" hidden></div>
    </section>

    <section class="controls">
      <button id="btn-trigger" class="big-btn"><span aria-hidden="true">↗</span> 指它</button>
      <label class="switch">
        <input type="checkbox" id="chk-wake">
        <span>语音唤醒</span><small>喊“那是什么”</small>
      </label>
      <details class="settings">
        <summary>设置与隐私</summary>
        <div class="settings-grid">
          <label>画面来源
            <select id="sel-source">
              <option value="camera">摄像头（真实）</option>
              <option value="demo" selected>演示场景（无需摄像头）</option>
            </select>
          </label>
          <label>手势源
            <select id="sel-hand">
              <option value="auto" selected>自动（MediaPipe → 合成）</option>
              <option value="mediapipe">MediaPipe Hands</option>
              <option value="synthetic">合成（演示）</option>
            </select>
          </label>
          <label>物件检测
            <select id="sel-detector">
              <option value="auto" selected>自动（YOLO → 演示检测）</option>
              <option value="yolo">YOLOv8n（ONNX）</option>
              <option value="saliency">演示检测器（颜色显著性）</option>
            </select>
          </label>
          <label class="chk"><input type="checkbox" id="chk-upload" checked> 确认后上传所选框裁切图（不传原图，可关）</label>
          <label class="chk"><input type="checkbox" id="chk-mirror" checked> 前摄画面镜像</label>
          <label class="chk"><input type="checkbox" id="chk-debug"> 调试面板</label>
          <div class="links">
            <a href="/admin.html" target="_blank">打开家长报表 <span aria-hidden="true">↗</span></a>
          </div>
        </div>
      </details>
      <pre id="debug" class="debug" hidden></pre>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
