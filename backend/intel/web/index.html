<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>数据情报 · 人工审核工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bd:#e2e6ea; --mut:#7a828a; --ok:#177e4d; --bad:#b3261e; --warn:#9a6b00; --bg:#f6f7f9; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:#22262a; }
  header { background:#1f2530; color:#fff; padding:10px 18px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:#aab3bd; font-size:12px; }
  header .right { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:12px; color:#cfd6dd;}
  nav { display:flex; gap:4px; padding:10px 18px 0; }
  nav button { border:1px solid var(--bd); background:#fff; padding:6px 14px; border-radius:6px 6px 0 0; cursor:pointer; font-size:13px; }
  nav button.on { font-weight:600; border-bottom-color:#fff; }
  main { margin:0 18px; background:#fff; border:1px solid var(--bd); border-top:none; padding:14px; min-height:60vh; }
  .bar { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; font-size:13px;}
  .chip { background:#eef1f4; border-radius:10px; padding:1px 10px; font-size:12px; }
  input, select, textarea { border:1px solid var(--bd); border-radius:4px; padding:4px 8px; font:inherit; }
  textarea { width:100%; min-height:54px; font-family:Consolas,monospace; font-size:12.5px; }
  .card { border:1px solid var(--bd); border-radius:8px; padding:10px 12px; margin-bottom:10px; background:#fff; }
  .card.filtered { background:#faf3f2; border-color:#e5c4c1; }
  .card.discarded, .card.kg_pushed { opacity:.62; }
  .t { font-weight:600; font-size:14.5px; }
  .t a { color:inherit; text-decoration:none; }
  .t a:hover { text-decoration:underline; }
  .meta { color:var(--mut); font-size:12px; margin:2px 0 8px; display:flex; gap:10px; flex-wrap:wrap;}
  .badge { font-size:11px; padding:0 8px; border-radius:8px; color:#fff; }
  .b-pending_struct{background:#8a93a0}.b-structured{background:#2b6cb0}.b-approved{background:#b7791f}
  .b-kg_pushed{background:var(--ok)}.b-discarded{background:#718096}.b-kg_pending{background:var(--warn)}
  .b-filtered{background:var(--bad)}.b-llm_failed{background:#6b46c1}
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .f label { font-size:12px; color:var(--mut); display:block; }
  .acts { display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap;}
  button.p { cursor:pointer; border-radius:4px; padding:5px 14px; border:1px solid var(--bd); background:#fff;}
  button.ok { background:var(--ok); border-color:var(--ok); color:#fff;}
  button.no { background:#fff; color:var(--bad); border-color:#d9a09c;}
  .gate { font-size:12px; color:var(--bad); }
  .msg { position:fixed; right:16px; bottom:16px; background:#22262a; color:#fff; padding:8px 14px; border-radius:6px; display:none; max-width:60vw;}
  .kv { font-size:12.5px; }
  .kv b { color:#333; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; border-bottom:1px solid var(--bd); padding:6px 8px; vertical-align:top;}
  th { color:var(--mut); font-weight:500; font-size:12px; }
  .md { white-space:pre-wrap; background:#f6f7f9; padding:10px; border-radius:6px; font-size:12.5px;}
</style>
</head>
<body>
<header>
  <h1>数据情报 · 人工审核工作台</h1>
  <span class="sub">知乎采集 → LLM 结构化 → 人工闸门 → KG 热更新（未经审核不得入 KG）</span>
  <div class="right" id="health">…</div>
</header>
<nav>
  <button data-tab="pool" class="on">问题池</button>
  <button data-tab="sent">舆情</button>
  <button data-tab="report">周报</button>
</nav>
<main>
  <section id="tab-pool">
    <div class="bar">
      <b id="week"></b>
      <span id="counts"></span>
      <label>审核人 <input id="reviewer" placeholder="姓名" style="width:90px"></label>
      <label>状态 <select id="st">
        <option value="">全部待处理</option><option value="pending_struct">待结构化</option>
        <option value="structured">已结构化</option><option value="approved">已批准</option>
        <option value="kg_pending">KG待重试</option><option value="kg_pushed">已入KG</option>
        <option value="discarded">已丢弃</option><option value="filtered">敏感过滤</option>
        <option value="llm_failed">LLM失败</option></select></label>
      <label><input type="checkbox" id="incf"> 含敏感过滤条目</label>
      <button class="p" onclick="load()">刷新</button>
      <span class="gate">红线: 敏感过滤(filtered)与未结构化条目不可入 KG</span>
    </div>
    <div id="list"></div>
  </section>
  <section id="tab-sent" style="display:none">
    <div class="bar">
      <b>舆情监控</b>
      <label>倾向 <select id="ss"><option value="">全部</option>
        <option value="negative">负面</option><option value="neutral">中性</option>
        <option value="positive">正面</option><option value="unknown">未分类</option></select></label>
      <label>近 <input id="sh" type="number" value="48" style="width:60px"> 小时</label>
      <button class="p" onclick="loadSent()">刷新</button>
    </div>
    <table id="senttbl"><thead><tr><th>倾向</th><th>词(类型)</th><th>标题</th><th>问题域</th><th>置信</th><th>推送</th><th>时间</th></tr></thead><tbody></tbody></table>
  </section>
  <section id="tab-report" style="display:none">
    <div class="bar"><b>家长语言雷达周报</b>
      <button class="p" onclick="runReport()">手动触发周报</button>
      <span id="repmsg" class="chip"></span></div>
    <div id="report" class="md">加载中…</div>
  </section>
</main>
<div class="msg" id="msg"></div>
<script>
const $=s=>document.querySelector(s);
const STATUS_CN={pending_struct:'待结构化',structured:'已结构化',approved:'已批准',kg_pending:'KG待重试',kg_pushed:'已入KG',discarded:'已丢弃',filtered:'敏感过滤',llm_failed:'LLM失败'};
const KIND_CN={brand:'品牌',competitor:'竞品',category:'品类'};
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',3500);}
async function api(u,opt){const r=await fetch(u,Object.assign({headers:{'Content-Type':'application/json'}},opt||{}));const j=await r.json().catch(()=>({}));if(!r.ok&&!j.error)j.error='HTTP '+r.status;return j;}
async function loadHealth(){try{const h=await api('/intel/health');$('#health').innerHTML=
 `provider <b>${h.provider}</b> | LLM ${h.llm?'✓':'✗'} | KG ${h.kg_url} | 企微 ${h.wecom?'✓':'落盘outbox'} | 今日额度 ${h.quota_used_today}/${h.quota_limit}`;}catch(e){$('#health').textContent='服务未连接';}}
async function load(){
  const st=$('#st').value, incf=$('#incf').checked?1:0;
  let u='/intel/question-pool?'; if(st)u+='status='+st+'&'; if(incf)u+='include_filtered=1&';
  const d=await api(u); $('#week').textContent='本周 '+d.week;
  $('#counts').innerHTML=Object.entries(d.counts||{}).map(([k,v])=>`<span class="chip">${STATUS_CN[k]||k} ${v}</span>`).join('');
  $('#list').innerHTML=(d.items||[]).map(card).join('')||'<p style="color:#7a828a">本周暂无候选条目。运行 POST /intel/pipeline/run 或等待每日 02:00 定时抓取。</p>';
}
function card(it){
  const editable=!['kg_pushed','discarded'].includes(it.status);
  const ro=editable?'':'readonly';
  const edges=(it.kg_edges?JSON.parse(it.kg_edges):[]).map(e=>`${e.head} -[${e.rel}]-> ${e.tail} (w${e.weight})`).join('\n');
  return `<div class="card ${it.status}" id="c${it.id}">
   <div class="t"><a href="${it.url||'#'}" target="_blank" rel="noopener">${esc(it.title)}</a></div>
   <div class="meta"><span class="badge b-${it.status}">${STATUS_CN[it.status]||it.status}</span>
    <span>#${it.id}</span><span>分 ${(+it.score).toFixed(2)}</span><span>👍${it.vote_up} 💬${it.comment_count}</span>
    <span>难度 ${it.difficulty??'-'}</span><span>${it.created_at}</span></div>
   <div class="kv" style="margin-bottom:6px"><b>现象:</b> ${esc(it.phenomenon||'—')} 　<b>孩子问:</b> ${esc(it.child_question||'—')}</div>
   <div class="grid2">
     <div class="f"><label>fact（面向儿童的知识点，必填才可批准）</label><textarea id="f${it.id}" ${ro}>${esc(it.fact||'')}</textarea></div>
     <div class="f"><label>kg_edges（JSON，入 KG 的知识边）</label><textarea id="e${it.id}" ${ro}>${esc(edges||'')}</textarea></div>
   </div>
   <div class="acts">
     ${it.status==='filtered'?'<span class="gate">⛔ 敏感前置过滤条目，禁止入 KG</span>':editable?`
      <button class="p ok" onclick="act(${it.id},'approve')">通过 → 推 KG</button>
      <button class="p no" onclick="act(${it.id},'discard')">丢弃</button>
      <span style="color:#7a828a;font-size:12px">修改上方字段后点“通过”即留痕提交</span>`
      :`<span class="chip">${STATUS_CN[it.status]}</span>`}
   </div></div>`;
}
function parseEdges(txt){
  if(!txt.trim())return[];
  try{const v=JSON.parse(txt);if(Array.isArray(v))return v;
    return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\S+)\s*-\[(\w+)\]->\s*(\S+)/);return m&&{head:m[1],rel:m[2],tail:m[3]};}).filter(Boolean);
  }catch(e){throw new Error('kg_edges 不是合法 JSON');}
}
async function act(id,action){
  const reviewer=$('#reviewer').value.trim();
  if(!reviewer)return toast('请先填审核人（留痕要求）');
  let edits;
  try{edits={fact:$('#f'+id).value,kg_edges:parseEdges($('#e'+id).value)};}
  catch(e){return toast(e.message);}
  const u=`/intel/question-pool/${id}/${action}`;
  const j=await api(u,{method:'POST',body:JSON.stringify({reviewer,edits:action==='approve'?edits:undefined,note:action==='discard'?'工作台丢弃':''})});
  toast(j.ok?(action==='approve'?`已通过${j.edited&&j.edited.length?'（含修改留痕）':''}，KG: applied=${j.kg&&j.kg.applied}`:'已丢弃'):'失败: '+(j.error||j.kg&&j.kg.error));
  load();loadHealth();
}
async function loadSent(){
  const s=$('#ss').value,sh=$('#sh').value||48;
  let u='/intel/sentiment?limit=100'; if(s)u+='&sentiment='+s; if(sh)u+='&since_hours='+sh;
  const d=await api(u);
  $('#senttbl tbody').innerHTML=(d.items||[]).map(it=>`<tr>
    <td>${it.sentiment==='negative'?'🔴负面':it.sentiment==='positive'?'🟢正面':it.sentiment==='neutral'?'⚪中性':'❓未分类'}</td>
    <td>${esc(it.watchword)}(${KIND_CN[it.watchword_kind]||it.watchword_kind})</td>
    <td><a href="${it.url}" target="_blank" rel="noopener">${esc(it.title)}</a></td>
    <td>${esc(it.issue_tag||'')}</td><td>${it.confidence?it.confidence.toFixed(2):''}</td>
    <td>${it.pushed?'已推':'—'}</td><td>${it.created_at}</td></tr>`).join('')
    ||'<tr><td colspan=7 style="color:#7a828a">暂无数据。POST /intel/sentiment/poll 手动轮询。</td></tr>';
}
async function runReport(){
  $('#repmsg').textContent='生成中…';
  const j=await api('/intel/weekly-report/run',{method:'POST',body:'{}'});
  $('#repmsg').textContent=j.ok?'已生成并推送':'失败: '+(j.error||'');
  loadReport();
}
async function loadReport(){
  const j=await api('/intel/reports/latest');
  $('#report').textContent=j.markdown||'暂无周报。点击“手动触发周报”生成。';
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  ['pool','sent','report'].forEach(t=>$('#tab-'+t).style.display=t===b.dataset.tab?'':'none');
  if(b.dataset.tab==='sent')loadSent(); if(b.dataset.tab==='report')loadReport();
});
$('#st').onchange=load; $('#incf').onchange=load;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
loadHealth();load();setInterval(loadHealth,30000);
</script>
</body>
</html>
