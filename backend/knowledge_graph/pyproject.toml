# 本文件**只提供工具配置**，不声明可安装的分发包。
#
# 为什么不加 [project] / [build-system]：本组件是扁平模块布局，顶层模块名很通用
# （kg / server / cleaning / llm_client …）。一旦做成可 pip install 的包，这些名字会进入
# site-packages 顶层命名空间：
#   - 与 backend/intel 的 llm_client.py、server.py 直接同名冲突（且内容不同）；
#   - 也容易与第三方库互相遮蔽。
# 需要真正打包时，先把模块收进 knowledge_graph/ 包目录再加 [project]。
#
# 运行依赖见 requirements.txt。
#
# 注意：本组件目前**没有自动化测试**（只有手工 scripts/acceptance.py，需先起 server.py）。
# 下面的 pytest 配置是为将来补测试预留的；补测试属独立工作，见
# docs/IMPLEMENTATION_BACKLOG.md。

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
